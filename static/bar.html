<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bartenders of Corfu — Bar top</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2b1a0f">
    <meta name="color-scheme" content="dark">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonts load without holding up the table; system fonts stand in until then. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Figtree:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="/static/css/bar.css">
</head>

<body>
    <header class="topline">
        <a class="home" href="/">All games</a>
        <h1 class="wordmark">Bartenders of Corfu</h1>
    </header>
    <div id="turnbar" class="turnbar" aria-live="polite"></div>
    <main id="table" class="table"></main>
    <div id="ending" class="ending" hidden></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script type="module" src="/static/bar/app.js"></script>
</body>

</html>
